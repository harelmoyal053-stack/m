<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>השוואת מחירים - סופרמרקטים</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4f8;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --radius: 16px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: #fff;
      padding: 12px 28px;
      border-radius: 999px;
      margin-bottom: 16px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.3);
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Shopping list input ── */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .input-row input {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.2s;
      direction: rtl;
    }

    .input-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .input-row select {
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s;
      direction: rtl;
    }

    .input-row select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-ghost {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: #e5eaf0; }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: none;
      padding: 4px 8px;
      font-size: 0.85rem;
    }
    .btn-danger:hover { background: #fef2f2; border-radius: 4px; }

    /* ── Items list ── */
    #itemsList {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 40px;
    }

    .item-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 0.9rem;
      animation: fadeIn 0.2s ease;
    }

    .item-chip .item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-chip .item-name { font-weight: 600; }
    .item-chip .item-qty {
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      padding: 12px 0;
    }

    /* ── Compare button ── */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .btn-compare {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      padding: 13px 32px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.3);
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .btn-compare:hover {
      box-shadow: 0 6px 24px rgba(37,99,235,0.4);
      transform: translateY(-1px);
    }

    /* ── Results ── */
    #results { display: none; }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .market-card {
      border-radius: var(--radius);
      padding: 22px 20px;
      border: 2px solid var(--border);
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      background: var(--card);
    }

    .market-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

    .market-card.winner {
      border-color: var(--accent);
      background: linear-gradient(145deg, #f0fdf4, #ffffff);
    }

    .winner-badge {
      position: absolute;
      top: -12px;
      right: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .market-logo {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .market-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .market-total {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .market-card.winner .market-total { color: var(--accent); }

    .market-savings {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 14px;
      min-height: 18px;
    }

    .market-breakdown {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
    }

    .breakdown-row .b-name { color: var(--muted); }

    .breakdown-row .b-price { font-weight: 600; }

    .breakdown-row.not-found .b-name,
    .breakdown-row.not-found .b-price {
      color: var(--danger);
      font-size: 0.8rem;
    }

    /* ── Summary bar ── */
    .summary-bar {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: #fff;
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .summary-bar .icon { font-size: 2rem; }

    .summary-bar .summary-text { flex: 1; }

    .summary-bar .summary-title {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    .summary-bar .summary-main {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .summary-bar .summary-saving {
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* ── Quick add suggestions ── */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .suggestion-chip {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .suggestion-chip:hover { background: #dbeafe; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.35s ease; }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .card { padding: 20px 16px; }
      .input-row { flex-direction: column; }
      .btn-compare { width: 100%; justify-content: center; }
    }

    /* ── Tooltip on prices ── */
    .price-tag {
      display: inline-block;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🛒 השוואת מחירים</div>
  <p>בדקו היכן הכי משתלם לקנות את רשימת הקניות שלכם</p>
</header>

<div class="container">

  <!-- Input Card -->

      הצעות מהירות — לחצו להוספה:
    </p>
    <div class="suggestions" id="suggestions"></div>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="שם המוצר (לדוג׳ קולה, גבינה צהובה...)" />
      <select id="qtyInput">
        <option value="1">כמות: 1</option>
        <option value="2">כמות: 2</option>
        <option value="3">כמות: 3</option>
        <option value="4">כמות: 4</option>
        <option value="5">כמות: 5</option>

      <button class="btn btn-primary" onclick="addItem()">➕ הוסף</button>
    </div>

    <div id="itemsList"><p class="empty-msg">הרשימה ריקה — הוסיפו פריטים למעלה</p></div>

    <div class="actions" style="margin-top:20px;">
      <button class="btn btn-compare" onclick="compare()">🔍 השווה מחירים</button>
      <button class="btn btn-ghost" onclick="clearAll()">🗑️ נקה הכל</button>
    </div>
  </div>

  <!-- Results Card -->
  <div class="card fade-in" id="results">
    <h2>📊 תוצאות ההשוואה</h2>
    <div id="summaryBar"></div>
    <div class="results-grid" id="resultsGrid"></div>

</div>

        "תפוחי אדמה קילו":   6.20,
        "תפוחי אדמה":         6.20,
      }
    }
  };

  const SUGGESTIONS = [
    "קולה", "גבינה צהובה", "במבה", "עגבניות", "חלב",
    "לחם", "ביצים", "אורז", "פסטה", "שמן זית",
    "עוף", "קוטג׳", "יוגורט", "שוקולד", "תפוחים"
  ];

  // ─────────────────────────────────────────
  //  STATE
  // ─────────────────────────────────────────
  let shoppingList = []; // [{name, qty}]

  // ─────────────────────────────────────────
  //  INIT
  // ─────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    renderSuggestions();
    document.getElementById('itemInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });
  });

  function renderSuggestions() {
    const el = document.getElementById('suggestions');
    el.innerHTML = SUGGESTIONS.map(s =>
      `<span class="suggestion-chip" onclick="quickAdd('${s}')">${s}</span>`
    ).join('');
  }

  // ─────────────────────────────────────────
  //  ADD / REMOVE ITEMS
  // ─────────────────────────────────────────
  function quickAdd(name) {
    const existing = shoppingList.find(i => normalize(i.name) === normalize(name));
    if (existing) {
      existing.qty += 1;
    } else {
      shoppingList.push({ name, qty: 1 });
    }
    renderList();
  }

  function addItem() {
    const input = document.getElementById('itemInput');
    const qty   = parseInt(document.getElementById('qtyInput').value, 10);
    const name  = input.value.trim();
    if (!name) return;

    const existing = shoppingList.find(i => normalize(i.name) === normalize(name));
    if (existing) {
      existing.qty += qty;
    } else {
      shoppingList.push({ name, qty });
    }

    input.value = '';
    input.focus();
    renderList();
  }

  function removeItem(idx) {
    shoppingList.splice(idx, 1);
    renderList();
  }

  function clearAll() {
    shoppingList = [];
    renderList();
    document.getElementById('results').style.display = 'none';
  }

  function renderList() {
    const el = document.getElementById('itemsList');
    if (shoppingList.length === 0) {
      el.innerHTML = '<p class="empty-msg">הרשימה ריקה — הוסיפו פריטים למעלה</p>';
      return;
    }
    el.innerHTML = shoppingList.map((item, i) => `
      <div class="item-chip">
        <div class="item-info">
          <span class="item-qty">×${item.qty}</span>
          <span class="item-name">${escHtml(item.name)}</span>
        </div>
        <button class="btn btn-danger" onclick="removeItem(${i})" title="הסר">✕</button>
      </div>
    `).join('');
  }

  // ─────────────────────────────────────────
  //  COMPARE
  // ─────────────────────────────────────────
  function compare() {
    if (shoppingList.length === 0) {
      alert('אנא הוסיפו לפחות מוצר אחד לרשימה.');
      return;
    }

    const results = Object.entries(DB).map(([market, data]) => {
      let total = 0;
      let allFound = true;
      const breakdown = shoppingList.map(item => {
        const price = lookupPrice(data.prices, item.name);
        if (price === null) {
          allFound = false;
          return { name: item.name, qty: item.qty, price: null, subtotal: null };
        }
        const subtotal = price * item.qty;
        total += subtotal;
        return { name: item.name, qty: item.qty, price, subtotal };
      });
      return { market, logo: data.logo, total, allFound, breakdown };
    });

    // Sort cheapest first
    results.sort((a, b) => a.total - b.total);

    const winner  = results[0];
    const priciest = results[results.length - 1];
    const saving   = priciest.total - winner.total;

    renderResults(results, winner, saving);
  }

  function lookupPrice(prices, name) {
    const key = normalize(name);
    for (const [k, v] of Object.entries(prices)) {
      if (normalize(k) === key) return v;
    }
    // Fuzzy: partial match
    for (const [k, v] of Object.entries(prices)) {
      if (normalize(k).includes(key) || key.includes(normalize(k))) return v;
    }
    return null;
  }

  function normalize(s) {
    return s.trim().toLowerCase()
      .replace(/[״׳''"\u05f3\u05f4]/g, '')
      .replace(/\s+/g, ' ');
  }

  // ─────────────────────────────────────────
  //  RENDER RESULTS
  // ─────────────────────────────────────────
  function renderResults(results, winner, saving) {
    const resultsEl = document.getElementById('results');
    resultsEl.style.display = 'block';
    resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Summary bar
    document.getElementById('summaryBar').innerHTML = `
      <div class="summary-bar">
        <span class="icon">${winner.logo}</span>
        <div class="summary-text">
          <div class="summary-title">הסופרמרקט המשתלם ביותר לרשימה שלכם</div>
          <div class="summary-main">${winner.market} — ${fmt(winner.total)} ₪</div>
        </div>
        ${saving > 0.01 ? `<div class="summary-saving">חסכון של<br/>${fmt(saving)} ₪</div>` : ''}
      </div>
    `;

    // Market cards
    document.getElementById('resultsGrid').innerHTML = results.map((r, rank) => `
      <div class="market-card ${rank === 0 ? 'winner' : ''}">
        ${rank === 0 ? '<div class="winner-badge">🏆 הזול ביותר</div>' : ''}
        <div class="market-logo">${r.logo}</div>
        <div class="market-name">${r.market}</div>
        <div class="market-total">${fmt(r.total)} ₪</div>
        <div class="market-savings">
          ${rank === 0 ? '✅ הכי משתלם לכם' : `יקר ב־${fmt(r.total - results[0].total)} ₪`}
        </div>
        <div class="market-breakdown">
          ${r.breakdown.map(b => b.price === null
            ? `<div class="breakdown-row not-found">
                 <span class="b-name">${escHtml(b.name)}</span>
                 <span class="b-price">לא נמצא</span>
               </div>`
            : `<div class="breakdown-row">
                 <span class="b-name">${escHtml(b.name)}${b.qty > 1 ? ` ×${b.qty}` : ''}</span>
                 <span class="b-price">${fmt(b.subtotal)} ₪</span>
               </div>`
          ).join('')}
        </div>
      </div>
    `).join('');
  }

  // ─────────────────────────────────────────
  //  UTILS
  // ─────────────────────────────────────────
  function fmt(n) {
    return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
